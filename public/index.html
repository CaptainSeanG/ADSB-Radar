<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADSB Radar</title>
    <link rel="stylesheet" href="./styles.css?v=20260608-3" />
  </head>
  <body>
    <main class="shell">
      <section class="radar-wrap" aria-label="ADS-B radar display">
        <canvas id="radar" aria-label="Radar screen"></canvas>
        <div class="scope-glass"></div>
      </section>

      <aside class="panel" aria-label="Radar controls and aircraft list">
        <header>
          <p class="eyebrow">ADS-B Radar</p>
          <h1>Local Airspace</h1>
          <p id="status">Radar sweep active. Updating aircraft every pass.</p>
        </header>

        <button type="button" class="settings-button" id="settingsOpen">Radar Settings</button>

        <form id="controls" class="controls">
          <label>
            Airport
            <select id="airportSelect" name="airport">
              <option value="">Custom coordinates</option>
              <option value="gps" selected>Use GPS location</option>
              <option value="33.7292,-111.9918">Default position</option>
              <option value="33.6883,-112.0830">KDVT - Phoenix Deer Valley</option>
              <option value="33.4353,-112.0059">KPHX - Phoenix Sky Harbor</option>
              <option value="33.6229,-111.9110">KSDL - Scottsdale</option>
              <option value="33.4608,-111.7280">KFFZ - Falcon Field</option>
              <option value="33.5269,-112.2950">KGEU - Glendale Municipal</option>
              <option value="33.3078,-111.6555">KIWA - Phoenix-Mesa Gateway</option>
              <option value="33.2691,-111.8110">KCHD - Chandler Municipal</option>
              <option value="33.4225,-112.3760">KGYR - Phoenix Goodyear</option>
              <option value="33.5350,-112.3830">KLUF - Luke AFB</option>
            </select>
          </label>
          <div class="coord-row" id="coordRow">
            <label>
              Latitude
              <input id="lat" name="lat" inputmode="decimal" value="33.7292" required />
            </label>
            <label>
              Longitude
              <input id="lon" name="lon" inputmode="decimal" value="-111.9918" required />
            </label>
          </div>

          <fieldset>
            <legend>Range</legend>
            <div class="range-buttons" id="rangeButtons">
              <button type="button" data-range="2">2</button>
              <button type="button" data-range="5">5</button>
              <button type="button" data-range="10" class="active">10</button>
              <button type="button" data-range="15">15</button>
              <button type="button" data-range="20">20</button>
              <button type="button" data-range="50">50</button>
              <button type="button" data-range="100">100</button>
            </div>
          </fieldset>

        </form>

        <section class="traffic">
          <div class="section-title">
            <h2>Traffic</h2>
            <span id="lastUpdate">Starting sweep</span>
          </div>
          <ol id="aircraftList"></ol>
        </section>
      </aside>
      <button type="button" class="panel-toggle" id="panelToggle" aria-label="Hide panel" aria-expanded="true" aria-controls="controls"></button>
    </main>

    <div class="modal-backdrop" id="settingsModal" hidden>
      <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="settings-header">
          <h2 id="settingsTitle">Settings</h2>
          <button type="button" class="icon-button" id="settingsClose" aria-label="Close settings">x</button>
        </header>

        <div class="settings-body">
          <fieldset>
            <legend>Airspace</legend>
            <div class="airspace-toggles" id="airspaceToggles">
              <label><input type="checkbox" data-class="B" /><span>Class B</span></label>
              <label><input type="checkbox" data-class="C" /><span>Class C</span></label>
              <label><input type="checkbox" data-class="D" checked /><span>Class D</span></label>
            </div>
          </fieldset>

          <label class="settings-range">
            <span>Breadcrumbs</span>
            <input id="breadcrumbLength" type="range" min="2" max="30" step="1" value="12" />
            <output id="breadcrumbReadout">12</output>
          </label>

          <label class="switch-row">
            <span>Ground traffic</span>
            <input id="groundTrafficToggle" type="checkbox" />
          </label>

          <label class="switch-row">
            <span>Flight Levels traffic</span>
            <input id="flightLevelsToggle" type="checkbox" checked />
          </label>

          <label class="switch-row">
            <span>Radar data</span>
            <input id="radarDataToggle" type="checkbox" checked />
          </label>

          <label class="switch-row">
            <span>Precipitation</span>
            <input id="precipitationToggle" type="checkbox" />
          </label>

          <label class="switch-row">
            <span>Radar sounds</span>
            <input id="radarSoundsToggle" type="checkbox" />
          </label>

          <label>
            Sound style
            <select id="radarSoundStyle">
              <option value="radar">Classic radar</option>
              <option value="tick">Tick</option>
              <option value="submarine">Submarine ping</option>
            </select>
          </label>

          <fieldset>
            <legend>Sweep color</legend>
            <label class="switch-row color-switch">
              <span>Green</span>
              <input id="sweepColorToggle" type="checkbox" checked />
              <span>Orange</span>
            </label>
          </fieldset>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="aircraftModal" hidden>
      <section class="settings-modal aircraft-modal" role="dialog" aria-modal="true" aria-labelledby="aircraftTitle">
        <header class="settings-header">
          <h2 id="aircraftTitle">Aircraft</h2>
          <button type="button" class="icon-button" id="aircraftClose" aria-label="Close aircraft details">x</button>
        </header>
        <div class="aircraft-detail" id="aircraftDetail"></div>
      </section>
    </div>

    <script src="./config.js?v=20260608-5"></script>
    <script type="module" src="./app.js?v=20260609-1"></script>
  </body>
</html>
